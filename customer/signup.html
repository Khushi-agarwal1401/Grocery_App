<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FreshCart Premium Storefront</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Global Stylesheets -->
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="../assets/css/customer.css" rel="stylesheet">
    <!-- Premium Login Styles -->
    <link href="../assets/css/login-premium.css" rel="stylesheet">
    <script>
        const colorScheme = localStorage.getItem("color-scheme") || "light";
        document.documentElement.setAttribute('data-theme', colorScheme);
    </script>
</head>
<body>

    <div class="split-login-wrapper">
        
        <!-- Left Side: Dynamic Branding Background -->
        <div class="split-left" style="--split-left-bg: linear-gradient(135deg, var(--success) 0%, #047857 100%);">
            <div class="glass-orb orb-1"></div>
            <div class="glass-orb orb-2"></div>
            <div class="glass-orb orb-3"></div>
            
            <div class="split-left-content">
                <h1 class="brand-title"><i class="bi bi-cart4 me-3"></i>FreshCart</h1>
                <p class="brand-subtitle">Join us today to experience instant grocery delivery, exclusive member discounts, and fresh deals daily.</p>
            </div>
        </div>

        <!-- Right Side: Signup Form -->
        <div class="split-right">
            <div class="login-card-premium">
                <!-- Mobile Logo (visible only on small screens) -->
                <a href="./index.html" class="login-logo-mobile">
                    <i class="bi bi-cart4"></i> FreshCart
                </a>

                <div class="mb-4">
                    <h3 class="fw-800 text-primary mb-2">Create Account</h3>
                    <p class="text-secondary">Sign up to start shopping instantly</p>
                </div>
                
                <form id="customerSignupForm" novalidate>
                    <label for="name" class="form-label-premium">Full Name</label>
                    <div class="input-group-premium">
                        <input type="text" class="form-control-premium" id="name" name="name" placeholder="Enter your full name" required>
                        <i class="bi bi-person-badge"></i>
                    </div>

                    <label for="email" class="form-label-premium">Email Address</label>
                    <div class="input-group-premium">
                        <input type="email" class="form-control-premium" id="email" name="email" placeholder="Enter your email address" required>
                        <i class="bi bi-envelope"></i>
                    </div>
                    
                    <label for="password" class="form-label-premium">Password</label>
                    <div class="input-group-premium">
                        <input type="password" class="form-control-premium" id="password" name="password" placeholder="Create a password" required>
                        <i class="bi bi-lock"></i>
                        <button class="password-toggle-btn" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <label for="confirm_password" class="form-label-premium">Confirm Password</label>
                    <div class="input-group-premium">
                        <input type="password" class="form-control-premium" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                        <i class="bi bi-lock-fill"></i>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-premium w-100 d-flex align-items-center justify-content-center gap-2 mb-4">
                        <span>Sign Up</span>
                        <i class="bi bi-person-plus-fill fs-5"></i>
                    </button>
                    
                    <div class="text-center">
                        <span class="text-secondary fw-500">Already have an account?</span>
                        <a href="login.html" class="text-success text-decoration-none fw-700 ms-1 hover-underline">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Modules -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle password
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            if (togglePassword && password) {
                togglePassword.addEventListener('click', function() {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    icon.classList.toggle('bi-eye');
                    icon.classList.toggle('bi-eye-slash');
                });
            }

            // Form Submission
            const form = document.getElementById('customerSignupForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const passwordVal = document.getElementById('password').value;
                const confirmPasswordVal = document.getElementById('confirm_password').value;

                if (!name || !email || !passwordVal || !confirmPasswordVal) {
                    window.API.showToast('Please fill in all fields.', 'warning');
                    return;
                }

                if (passwordVal !== confirmPasswordVal) {
                    window.API.showToast('Passwords do not match.', 'warning');
                    return;
                }

                try {
                    // Sign up shopper (regular user)
                    await window.Auth.signup({ name, email, password: passwordVal });
                } catch (err) {
                    // Handled by API wrapper
                }
            });
        });
    </script>
</body>
</html>
