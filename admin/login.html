<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Grocery Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Global Stylesheets -->
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="../assets/css/admin.css" rel="stylesheet">
    <!-- Premium Login Styles -->
    <link href="../assets/css/login-premium.css" rel="stylesheet">
    <script>
        const colorScheme = localStorage.getItem("color-scheme") || "light";
        document.documentElement.setAttribute('data-theme', colorScheme);
    </script>
</head>
<body>

    <div class="split-login-wrapper">
        
        <!-- Left Side: Dynamic Branding Background -->
        <!-- Using a deep blue/purple gradient for admin portal -->
        <div class="split-left" style="--split-left-bg: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);">
            <div class="glass-orb orb-1"></div>
            <div class="glass-orb orb-2"></div>
            <div class="glass-orb orb-3"></div>
            
            <div class="split-left-content">
                <h1 class="brand-title"><i class="bi bi-shield-lock me-3"></i>Admin Portal</h1>
                <p class="brand-subtitle">Manage inventory, process orders, and track analytics securely from your dashboard.</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="split-right">
            <div class="login-card-premium">
                <!-- Mobile Logo -->
                <div class="login-logo-mobile text-primary">
                    <i class="bi bi-shield-lock"></i> Admin Portal
                </div>

                <div class="mb-4">
                    <h3 class="fw-800 text-primary mb-2">System Access</h3>
                    <p class="text-secondary">Sign in to manage the platform</p>
                </div>
                
                <form id="adminLoginForm" novalidate>
                    <label for="username" class="form-label-premium">Admin Username</label>
                    <div class="input-group-premium">
                        <input type="text" class="form-control-premium" id="username" name="username" placeholder="Enter admin username (admin)" required>
                        <i class="bi bi-person-badge"></i>
                    </div>
                    
                    <label for="password" class="form-label-premium">Admin Password</label>
                    <div class="input-group-premium">
                        <input type="password" class="form-control-premium" id="password" name="password" placeholder="Enter password (admin123)" required>
                        <i class="bi bi-shield-key"></i>
                        <button class="password-toggle-btn" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                            <label class="form-check-label text-secondary fw-600 small" style="cursor:pointer;" for="remember_me">Remember me</label>
                        </div>
                        <a href="../customer/login.html" class="switch-portal-link text-primary text-decoration-none">
                            Customer Shop <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-premium w-100 d-flex align-items-center justify-content-center gap-2">
                        <span>Sign In to Admin</span>
                        <i class="bi bi-box-arrow-in-right fs-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Modules -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle Password visibility
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            if (togglePassword && password) {
                togglePassword.addEventListener('click', function() {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    icon.classList.toggle('bi-eye');
                    icon.classList.toggle('bi-eye-slash');
                });
            }

            // Handle Admin Login submission
            const form = document.getElementById('adminLoginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const passwordVal = password.value;
                const rememberMe = document.getElementById('remember_me').checked;

                if (!username || !passwordVal) {
                    window.API.showToast('Please fill in both fields.', 'warning');
                    return;
                }

                try {
                    await window.Auth.login(username, passwordVal, rememberMe, true);
                } catch (err) {
                    // Toast notifications handled by Auth.login or API wrapper
                }
            });
        });
    </script>
</body>
</html>
